<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerador de Quiz com Groq</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 20px; background: #f4f7f6; color: #333; }
    .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,.1); }
    textarea, input:not([type="radio"]) { width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
    button { background: #2ea44f; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
    button:hover { background: #2c974b; }
    button:disabled { opacity: .65; cursor: wait; }
    .question-box { background: #fafafa; border: 1px solid #e1e4e8; padding: 15px; border-radius: 6px; margin-top: 15px; }
    .option { display: block; margin: 8px 0; cursor: pointer; padding: 8px; background: #fff; border: 1px solid #ddd; border-radius: 4px; }
    .option:hover { background: #f0f0f0; }
    .option input { margin-right: 8px; }
    .correct { background: #d4edda; border-color: #c3e6cb; color: #155724; font-weight: bold; }
    .incorrect { background: #f8d7da; border-color: #f5c6cb; color: #721c24; }
    .error { color: #b42318; }
    .status { color: #52606d; font-size: 14px; margin-bottom: 18px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Gerador de Quiz com IA (Groq)</h1>
    <p class="status">A chave da API é mantida no servidor; não é necessário colá-la nesta página.</p>

    <label for="conteudo">Conteúdo da matéria:</label>
    <textarea id="conteudo" rows="5" placeholder="Cole aqui o texto ou resumo..."></textarea>

    <label for="qtd">Quantidade de questões (1 a 5):</label>
    <input type="number" id="qtd" min="1" max="5" value="3">

    <button id="generate" type="button">Gerar questões com IA</button>
    <div id="quiz-container" aria-live="polite"></div>
  </main>

  <script>
    const contentInput = document.getElementById('conteudo');
    const countInput = document.getElementById('qtd');
    const generateButton = document.getElementById('generate');
    const container = document.getElementById('quiz-container');

    function renderQuestions(questions) {
      const heading = document.createElement('h2');
      heading.textContent = 'Quiz gerado pelo Groq';
      container.replaceChildren(heading);

      questions.forEach((question, questionIndex) => {
        const box = document.createElement('section');
        box.className = 'question-box';
        const title = document.createElement('p');
        const strong = document.createElement('strong');
        strong.textContent = `Questão ${questionIndex + 1}: `;
        title.append(strong, document.createTextNode(question.pergunta));
        box.appendChild(title);

        question.opcoes.forEach((option, optionIndex) => {
          const label = document.createElement('label');
          label.className = 'option';
          const radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = `question-${questionIndex}`;
          radio.addEventListener('change', () => {
            box.querySelectorAll('.option').forEach((item, index) => {
              item.style.pointerEvents = 'none';
              if (index === question.correta) item.classList.add('correct');
              else if (index === optionIndex) item.classList.add('incorrect');
            });
          });
          label.append(radio, document.createTextNode(`${String.fromCharCode(65 + optionIndex)}) ${option}`));
          box.appendChild(label);
        });
        container.appendChild(box);
      });
    }

    function showError(message) {
      container.replaceChildren();
      const error = document.createElement('p');
      error.className = 'error';
      error.textContent = message;
      container.appendChild(error);
    }

    generateButton.addEventListener('click', async () => {
      const text = contentInput.value.trim();
      const count = Number(countInput.value);
      if (!text) return showError('Insira o conteúdo da matéria.');
      if (!Number.isInteger(count) || count < 1 || count > 5) {
        return showError('A quantidade de questões deve estar entre 1 e 5.');
      }

      generateButton.disabled = true;
      container.replaceChildren();
      const loading = document.createElement('h2');
      loading.textContent = 'O Groq está gerando as perguntas com base no seu texto...';
      container.appendChild(loading);

      try {
        const response = await fetch('/api/quiz', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, count })
        });
        const responseText = await response.text();
        let data;
        try {
          data = JSON.parse(responseText);
        } catch {
          throw new Error(
            'O servidor da API não está conectado a esta página. O GitHub Pages hospeda apenas a interface; publique o backend Node.js e configure GROQ_API_KEY no serviço de hospedagem.'
          );
        }
        if (!response.ok) throw new Error(data.error || 'Não foi possível gerar o quiz.');
        if (!Array.isArray(data.questions)) {
          throw new Error('A API Groq retornou uma resposta inesperada.');
        }
        renderQuestions(data.questions);
      } catch (error) {
        showError(error.message || 'Não foi possível gerar o quiz. Tente novamente.');
      } finally {
        generateButton.disabled = false;
      }
    });
  </script>
</body>
</html>
