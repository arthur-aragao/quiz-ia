<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Quiz com IA</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 20px; background: #f4f7f6; color: #333; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        textarea, input { width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        button { background: #2ea44f; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #2c974b; }
        .question-box { background: #fafafa; border: 1px solid #e1e4e8; padding: 15px; border-radius: 6px; margin-top: 15px; }
        .option { display: block; margin: 8px 0; cursor: pointer; padding: 8px; background: #fff; border: 1px solid #ddd; border-radius: 4px; }
        .option:hover { background: #f0f0f0; }
        .correct { background: #d4edda !important; border-color: #c3e6cb !important; color: #155724; }
        .incorrect { background: #f8d7da !important; border-color: #f5c6cb !important; color: #721c24; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Gerador de Quiz Inteligente</h2>
        <p>Cole seu texto de estudo abaixo e defina quantas questões deseja responder:</p>
        
        <label for="conteudo">Conteúdo da Matéria:</label>
        <textarea id="conteudo" rows="6" placeholder="Cole aqui o texto, resumo ou notas da aula..."></textarea>
        
        <label for="qtd">Quantidade de Questões:</label>
        <input type="number" id="qtd" min="1" max="5" value="3">
        
        <button onclick="gerarQuiz()">Gerar Perguntas</button>
        
        <div id="quiz-container" style="margin-top: 20px;"></div>
    </div>

    <script>
        function gerarQuiz() {
            const texto = document.getElementById('conteudo').value.trim();
            const qtd = parseInt(document.getElementById('qtd').value);
            const container = document.getElementById('quiz-container');
            
            if (!texto) {
                alert('Por favor, insira algum conteúdo para gerar o quiz!');
                return;
            }

            container.innerHTML = '<h3>Gerando questões...</h3>';

            // Simulação inteligente baseada nas frases do texto inserido
            setTimeout(() => {
                const frases = texto.split(/[.!?]+/).filter(f => f.trim().length > 10);
                let html = '<h3>Perguntas Geradas:</h3>';
                
                const total = Math.min(qtd, frases.length > 0 ? frases.length : 1);
                
                for (let i = 0; i < total; i++) {
                    const baseFrase = frases[i % frases.length].trim();
                    html += `
                        <div class="question-box">
                            <p><strong>Questão ${i + 1}:</strong> Com base no texto, o que podemos afirmar sobre: <em>"${baseFrase.substring(0, 40)}..."</em>?</p>
                            <label class="option"><input type="radio" name="q${i}" onclick="verificar(this, true)"> A) É um conceito central abordado no texto.</label>
                            <label class="option"><input type="radio" name="q${i}" onclick="verificar(this, false)"> B) É uma informação secundária sem relação direta.</label>
                            <label class="option"><input type="radio" name="q${i}" onclick="verificar(this, false)"> C) Contradiz os objetivos principais da matéria.</label>
                        </div>
                    `;
                }
                container.innerHTML = html;
            }, 600);
        }

        function verificar(element, isCorrect) {
            const parent = element.parentElement.parentElement;
            const options = parent.querySelectorAll('.option');
            options.forEach(opt => {
                opt.style.pointerEvents = 'none';
                if(opt.querySelector('input').getAttribute('onclick').includes('true')) {
                    opt.classList.add('correct');
                } else if(opt.querySelector('input') === element && !isCorrect) {
                    opt.classList.add('incorrect');
                }
            });
        }
    </script>
</body>
</html>
